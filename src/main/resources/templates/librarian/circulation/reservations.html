<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservation Hold Queue - Circulation Desk - SmartLibrary ERP</title>
</head>
<body>
<div th:replace="~{layout/base :: div}" th:with="pageTitle='Reservation & Hold Queues', activeMenu='lib-reservations'">
    <div th:fragment="content">
        <div class="stat-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <div class="stat-label">Pending Holds</div>
                    <div class="stat-value" th:text="${pendingHolds}">0</div>
                </div>
                <div class="stat-icon purple"><i class="fa-solid fa-hourglass-half"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <div class="stat-label">Ready for Pickup (Notified)</div>
                    <div class="stat-value" th:text="${notifiedHolds}">0</div>
                </div>
                <div class="stat-icon green"><i class="fa-solid fa-bell"></i></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-list-ol"></i> Patron Book Reservations Queue</div>
            </div>
            <div class="table-responsive">
                <table class="erp-table">
                    <thead>
                    <tr>
                        <th>Queue #</th>
                        <th>Book Title</th>
                        <th>Patron Member</th>
                        <th>Date Reserved</th>
                        <th>Status</th>
                        <th>Hold Valid Until</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(reservations)}">
                        <td colspan="6" style="text-align: center; color: #94a3b8; padding: 2rem;">No active reservations in queue.</td>
                    </tr>
                    <tr th:each="r : ${reservations}">
                        <td><strong th:text="${'#' + r.queuePosition}">#1</strong></td>
                        <td>
                            <strong th:text="${r.book.title}">Clean Code</strong>
                            <div style="font-size: 0.75rem; color: #64748b;" th:text="${'ISBN: ' + r.book.isbn}">ISBN</div>
                        </td>
                        <td>
                            <span th:text="${r.member.user.getFullName()}">John Doe</span>
                            <div style="font-size: 0.75rem; color: #64748b;" th:text="${r.member.memberCode}">MEM-2026-0001</div>
                        </td>
                        <td th:text="${r.reservationDate}">2026-09-03</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${r.status.name() == 'NOTIFIED' ? 'badge-success' : (r.status.name() == 'PENDING' ? 'badge-warning' : 'badge-secondary')}"
                                  th:text="${r.status}">PENDING</span>
                        </td>
                        <td th:text="${r.holdExpiryDate != null ? r.holdExpiryDate : '-'}">-</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
