<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Issue Book - Circulation Desk - SmartLibrary ERP</title>
</head>
<body>
<div th:replace="~{layout/base :: div}" th:with="pageTitle='Circulation Desk - Issue / Checkout Book', activeMenu='lib-borrow'">
    <div th:fragment="content">
        <div class="card" style="max-width: 750px; margin: 0 auto;">
            <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-barcode"></i> Book Checkout Desk</div>
                <a th:href="@{/librarian/dashboard}" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
            </div>
            <div class="card-body">
                <form th:action="@{/librarian/borrow}" th:object="${borrowDto}" method="post">
                    <div class="form-group">
                        <label class="form-label">Patron Member ID * (e.g. MEM-2026-0001)</label>
                        <input type="text" th:field="*{memberCode}" class="form-control"
                               placeholder="Scan member card or enter ID..." autofocus required>
                        <span class="text-danger" th:if="${#fields.hasErrors('memberCode')}" th:errors="*{memberCode}"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Book Copy Barcode * (e.g. BC-9780132350884-001)</label>
                        <input type="text" th:field="*{barcode}" class="form-control"
                               placeholder="Scan book barcode sticker..." required>
                        <span class="text-danger" th:if="${#fields.hasErrors('barcode')}" th:errors="*{barcode}"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Transaction Remarks (Optional)</label>
                        <input type="text" th:field="*{remarks}" class="form-control" placeholder="Desk notes...">
                    </div>

                    <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 1rem; margin-bottom: 1.5rem; font-size: 0.85rem; color: #475569;">
                        <i class="fa-solid fa-circle-info" style="color: #3b82f6;"></i>
                        <strong>Circulation Enforcement:</strong> The system automatically verifies that the member's account is active, their tier borrowing limit is respected, and the physical copy is marked AVAILABLE. Due dates are computed based on the patron's membership tier.
                    </div>

                    <button type="submit" class="btn btn-primary w-100" style="padding: 0.75rem;">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> Complete Checkout & Issue Book
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
