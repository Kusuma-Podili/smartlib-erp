<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member Registry - SmartLibrary ERP</title>
</head>
<body>
<div th:replace="~{layout/base :: div}" th:with="pageTitle='Member Registry & Accounts', activeMenu='lib-members'">
    <div th:fragment="content">
        <div class="d-flex justify-between align-center mb-3">
            <h2 style="font-size: 1.25rem; font-weight: 600;">Circulation Desk - Members</h2>
            <a th:href="@{/librarian/members/new}" class="btn btn-primary">
                <i class="fa-solid fa-user-plus"></i> Register New Member
            </a>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <form th:action="@{/librarian/members}" method="get" class="d-flex gap-2">
                    <input type="text" name="query" th:value="${query}" class="form-control"
                           placeholder="Lookup member by ID, patron name, or email...">
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
                    <a th:href="@{/librarian/members}" class="btn btn-secondary">Reset</a>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="erp-table">
                    <thead>
                    <tr>
                        <th>Member Code</th>
                        <th>Name</th>
                        <th>Email / Phone</th>
                        <th>Tier</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(members)}">
                        <td colspan="6" style="text-align: center; color: #94a3b8; padding: 2rem;">No members found.</td>
                    </tr>
                    <tr th:each="mem : ${members}">
                        <td><code th:text="${mem.memberCode}">MEM-2026-0001</code></td>
                        <td><strong th:text="${mem.user.getFullName()}">John Doe</strong></td>
                        <td th:text="${mem.user.email}">john@doe.com</td>
                        <td><span class="badge badge-info" th:text="${mem.membershipType.name}">Student</span></td>
                        <td>
                            <span class="badge" th:classappend="${mem.user.isActive() ? 'badge-success' : 'badge-danger'}"
                                  th:text="${mem.user.status}">ACTIVE</span>
                        </td>
                        <td>
                            <a th:href="@{'/librarian/members/' + ${mem.id}}" class="btn btn-secondary btn-sm">
                                <i class="fa-solid fa-address-card"></i> Member Profile
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
