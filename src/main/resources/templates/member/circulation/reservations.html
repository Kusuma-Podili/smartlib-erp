<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Reservations - SmartLibrary ERP</title>
</head>
<body>
<div th:replace="~{layout/base :: div}" th:with="pageTitle='My Hold Queue & Reservations', activeMenu='mem-reservations'">
    <div th:fragment="content">
        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-list-ol"></i> My Book Reservations & Queue Rank</div>
            </div>
            <div class="table-responsive">
                <table class="erp-table">
                    <thead>
                    <tr>
                        <th>Book Title</th>
                        <th>ISBN</th>
                        <th>Queue Position</th>
                        <th>Status</th>
                        <th>Reserved Date</th>
                        <th>Hold Expiry</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(reservations)}">
                        <td colspan="7" style="text-align: center; color: #94a3b8; padding: 2.5rem;">
                            <i class="fa-solid fa-bookmark" style="font-size: 2rem; display: block; margin-bottom: 0.5rem;"></i>
                            You have no active book holds or reservations.
                        </td>
                    </tr>
                    <tr th:each="r : ${reservations}">
                        <td><strong th:text="${r.book.title}">Clean Code</strong></td>
                        <td><code th:text="${r.book.isbn}">978-0132350884</code></td>
                        <td>
                            <strong style="color: #1e3a8a; font-size: 1.1rem;" th:text="${'#' + r.queuePosition}">#1</strong>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${r.status.name() == 'NOTIFIED' ? 'badge-success' : (r.status.name() == 'PENDING' ? 'badge-warning' : 'badge-secondary')}"
                                  th:text="${r.status}">PENDING</span>
                            <div th:if="${r.status.name() == 'NOTIFIED'}" style="font-size: 0.75rem; color: #059669; font-weight: 600;">
                                Ready for pickup!
                            </div>
                        </td>
                        <td th:text="${r.reservationDate}">2026-09-03</td>
                        <td th:text="${r.holdExpiryDate != null ? r.holdExpiryDate : '-'}">-</td>
                        <td>
                            <form th:action="@{'/member/reservations/' + ${r.id} + '/cancel'}" method="post"
                                  th:if="${r.status.name() == 'PENDING' || r.status.name() == 'NOTIFIED'}">
                                <button type="submit" class="btn btn-secondary btn-sm" onclick="return confirm('Cancel this hold reservation?')">
                                    <i class="fa-solid fa-xmark"></i> Cancel Hold
                                </button>
                            </form>
                            <span th:unless="${r.status.name() == 'PENDING' || r.status.name() == 'NOTIFIED'}" style="color: #94a3b8; font-size: 0.8rem;">
                                Concluded
                            </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
