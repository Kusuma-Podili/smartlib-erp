<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library Catalog - SmartLibrary ERP</title>
</head>
<body>
<div th:replace="~{layout/base :: div}" th:with="pageTitle='Library Catalog & Book Discovery', activeMenu='mem-catalog'">
    <div th:fragment="content">
        <!-- Search & Filter Card -->
        <div class="card mb-4">
            <div class="card-body">
                <form th:action="@{/member/catalog}" method="get" class="d-flex gap-2" style="flex-wrap: wrap;">
                    <div style="flex: 2; min-width: 220px;">
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control"
                               placeholder="Search catalog by title, author, or ISBN...">
                    </div>
                    <div style="flex: 1; min-width: 160px;">
                        <select name="categoryId" class="form-control">
                            <option value="">All Categories</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}"
                                    th:text="${cat.name}" th:selected="${cat.id == categoryId}">Category</option>
                        </select>
                    </div>
                    <div class="d-flex align-center gap-2" style="padding: 0 0.5rem;">
                        <input type="checkbox" id="availableOnly" name="availableOnly" value="true" th:checked="${availableOnly}">
                        <label for="availableOnly" style="font-size: 0.85rem; cursor: pointer;">Available Only</label>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> Explore</button>
                    <a th:href="@{/member/catalog}" class="btn btn-secondary">Reset</a>
                </form>
            </div>
        </div>

        <!-- Catalog Grid -->
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;">
            <div th:if="${#lists.isEmpty(books)}" style="grid-column: 1 / -1; text-align: center; color: #94a3b8; padding: 3rem;">
                <i class="fa-solid fa-book" style="font-size: 3rem; display: block; margin-bottom: 0.75rem;"></i>
                No catalog titles found matching your search.
            </div>

            <div th:each="book : ${books}" class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
                <div class="card-body">
                    <div class="d-flex justify-between align-center mb-2">
                        <span class="badge badge-info" th:text="${book.category.name}">Category</span>
                        <span class="badge" th:classappend="${book.getAvailableCopiesCount() > 0 ? 'badge-success' : 'badge-danger'}"
                              th:text="${book.getAvailableCopiesCount() > 0 ? (book.getAvailableCopiesCount() + ' Available') : 'All Borrowed'}">3 Available</span>
                    </div>

                    <h3 style="font-size: 1.1rem; font-weight: 700; color: #0f172a; margin-bottom: 0.25rem;" th:text="${book.title}">Book Title</h3>
                    <div style="font-size: 0.85rem; color: #64748b; margin-bottom: 0.5rem;" th:text="${book.getAuthorsFormatted()}">Author</div>

                    <div style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.75rem;">
                        ISBN: <code th:text="${book.isbn}">978-0132350884</code> • Location: <span th:text="${book.shelfNumber != null ? book.shelfNumber : 'Main Stack'}">S-1</span>
                    </div>

                    <p th:if="${book.description}" style="font-size: 0.825rem; color: #475569; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;"
                       th:text="${book.description}">Short description</p>
                </div>

                <div class="card-footer" style="padding: 1rem 1.5rem; background: #fafafa; border-top: 1px solid #e2e8f0;">
                    <div th:if="${book.getAvailableCopiesCount() > 0}">
                        <span style="font-size: 0.8rem; color: #059669;">
                            <i class="fa-solid fa-circle-check"></i> Available for checkout at desk
                        </span>
                    </div>
                    <div th:unless="${book.getAvailableCopiesCount() > 0}">
                        <form th:action="@{'/member/catalog/' + ${book.id} + '/reserve'}" method="post">
                            <button type="submit" class="btn btn-primary btn-sm w-100">
                                <i class="fa-solid fa-bookmark"></i> Place Hold / Reserve
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
