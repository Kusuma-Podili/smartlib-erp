<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found (404) - SmartLibrary ERP</title>
    <link rel="stylesheet" th:href="@{/css/erp-theme.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card" style="text-align: center;">
        <div style="font-size: 4rem; color: #f59e0b; margin-bottom: 1rem;">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h1 style="color: #0f172a; margin-bottom: 0.5rem;">404 - Not Found</h1>
        <p style="color: #64748b; margin-bottom: 1.5rem;" th:text="${errorMessage != null ? errorMessage : 'The requested resource or page could not be located.'}">
            The requested page does not exist.
        </p>
        <a th:href="@{/}" class="btn btn-primary w-100">
            <i class="fa-solid fa-house"></i> Return to Home
        </a>
    </div>
</div>
</body>
</html>
