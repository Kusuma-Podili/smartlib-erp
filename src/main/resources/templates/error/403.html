<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied (403) - SmartLibrary ERP</title>
    <link rel="stylesheet" th:href="@{/css/erp-theme.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card" style="text-align: center;">
        <div style="font-size: 4rem; color: #dc2626; margin-bottom: 1rem;">
            <i class="fa-solid fa-ban"></i>
        </div>
        <h1 style="color: #0f172a; margin-bottom: 0.5rem;">403 - Access Denied</h1>
        <p style="color: #64748b; margin-bottom: 1.5rem;">
            You do not have the required role or authorization to access this enterprise module.
        </p>
        <div th:if="${username}" style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 0.75rem; margin-bottom: 1.5rem; font-size: 0.85rem; color: #991b1b;">
            Logged in as: <strong th:text="${username}">User</strong>
        </div>
        <a th:href="@{/}" class="btn btn-primary w-100">
            <i class="fa-solid fa-arrow-left"></i> Return to Authorized Dashboard
        </a>
    </div>
</div>
</body>
</html>
