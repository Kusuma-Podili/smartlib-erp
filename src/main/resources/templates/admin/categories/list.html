<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categories - SmartLibrary ERP</title>
</head>
<body>
<div th:replace="~{layout/base :: div}" th:with="pageTitle='Book Categories Taxonomy', activeMenu='admin-categories'">
    <div th:fragment="content">
        <div class="form-grid-2">
            <!-- Left: Add Category Card -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title"><i class="fa-solid fa-plus-circle"></i> Add New Category</div>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/categories}" th:object="${categoryDto}" method="post">
                        <div class="form-group">
                            <label class="form-label">Category Name *</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Computer Science" required>
                            <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Category Code * (Unique abbreviation)</label>
                            <input type="text" th:field="*{code}" class="form-control" placeholder="e.g. CS" required>
                            <span class="text-danger" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></span>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Category coverage..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fa-solid fa-save"></i> Save Category
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right: Existing Categories Table -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title"><i class="fa-solid fa-tags"></i> Registered Categories</div>
                </div>
                <div class="table-responsive">
                    <table class="erp-table">
                        <thead>
                        <tr>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Description</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="3" style="text-align: center; color: #94a3b8; padding: 2rem;">No categories registered.</td>
                        </tr>
                        <tr th:each="cat : ${categories}">
                            <td><span class="badge badge-info" th:text="${cat.code}">CS</span></td>
                            <td><strong th:text="${cat.name}">Computer Science</strong></td>
                            <td th:text="${cat.description != null ? cat.description : '-'}">-</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
