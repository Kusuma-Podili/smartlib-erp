<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>System Settings & Policies - SmartLibrary ERP</title>
</head>
<body>
<div th:replace="~{layout/base :: div}" th:with="pageTitle='Library Settings & Policies', activeMenu='admin-settings'">
    <div th:fragment="content">
        <div class="card" style="max-width: 900px; margin: 0 auto;">
            <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-sliders"></i> Global ERP Policies & Operational Settings</div>
            </div>
            <div class="table-responsive">
                <table class="erp-table">
                    <thead>
                    <tr>
                        <th>Setting Key</th>
                        <th>Description & Category</th>
                        <th>Value</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${settings}">
                        <td><code th:text="${s.settingKey}">circulation.default_fine_rate</code></td>
                        <td>
                            <strong th:text="${s.description}">Daily overdue fine</strong>
                            <div><span class="badge badge-secondary" th:text="${s.category}">CIRCULATION</span></div>
                        </td>
                        <td>
                            <form th:action="@{/admin/settings/update}" method="post" class="d-flex gap-2">
                                <input type="hidden" name="settingKey" th:value="${s.settingKey}">
                                <input type="text" name="settingValue" th:value="${s.settingValue}" class="form-control" style="max-width: 180px;" required>
                                <button type="submit" class="btn btn-primary btn-sm"><i class="fa-solid fa-check"></i> Save</button>
                            </form>
                        </td>
                        <td><span style="color: #059669; font-size: 0.8rem;"><i class="fa-solid fa-shield-check"></i> Synced</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
