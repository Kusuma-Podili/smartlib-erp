server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  thymeleaf:
    cache: false

app:
  name: "SmartLibrary ERP Test"
  fine:
    default-per-day: 10.00
    grace-period-days: 1
    lost-multiplier: 2.0
  borrow:
    default-duration-days: 14
    max-renewals: 2
