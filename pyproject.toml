[tool.poetry]
name = "smartlib-erp"
version = "1.0.0"
description = "Enterprise Library Resource Planning System (Library ERP) in Pure Python"
authors = ["SmartLibrary Team"]
license = "MIT"
readme = "README.md"
packages = [{include = "smartlib"}]

[tool.poetry.dependencies]
python = "^3.10"
pytest = ">=7.0.0"

[tool.poetry.group.dev.dependencies]
coverage = ">=7.0.0"
flake8 = ">=6.0.0"
black = ">=23.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
